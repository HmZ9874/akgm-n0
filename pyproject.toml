[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akgm-n0"
version = "0.1.0"
description = "Auditable numerical knowledge genesis research prototype"
requires-python = ">=3.11"
dependencies = ["scipy>=1.14,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
